<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>КАФРЕСС — конгресс-кафе</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Pinyon+Script&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --brown:#3B1F14;
    --brown-2:#2A1610;
    --brown-3:#1A1410;
    --olive:#7A7A45;
    --olive-2:#5E5E33;
    --grey:#4A4A4A;
    --cream:#F5F2EE;
    --cream-2:#EDE6DA;
    --paper:#FBF8F3;
    --line:rgba(245,242,238,.14);
    --line-dark:rgba(58,31,20,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--brown-3);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}
  input,textarea,select{font-family:inherit}
  ::selection{background:var(--olive);color:#fff}

  /* ---- Type utilities ---- */
  .serif{font-family:"Cormorant Garamond",serif;font-weight:600;letter-spacing:.02em}
  .script{font-family:"Pinyon Script",cursive;font-weight:400}
  .mono{font-family:"JetBrains Mono",monospace}
  .upper{text-transform:uppercase;letter-spacing:.18em}

  /* ---- Header ---- */
  .topbar{background:var(--brown-3);color:#fff;border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;z-index:50}
  .topbar-inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:18px 36px;max-width:1600px;margin:0 auto}
  .nav-left{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
  .nav-right{display:flex;gap:22px;align-items:center;justify-content:flex-end}
  .nav-link{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.78);cursor:pointer;background:none;border:none;padding:8px 0;position:relative;transition:color .25s}
  .nav-link::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:var(--olive);transform:scaleX(0);transform-origin:left;transition:transform .35s}
  .nav-link:hover{color:#fff}
  .nav-link:hover::after,.nav-link.active::after{transform:scaleX(1)}
  .nav-link.active{color:#fff}
  .brand{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:34px;letter-spacing:.32em;color:#fff;cursor:pointer;line-height:1;padding:0 12px}
  .brand small{display:block;font-family:"Pinyon Script",cursive;font-size:14px;letter-spacing:0;color:var(--olive);text-transform:none;margin-top:4px;font-weight:400}
  .icon-btn{width:34px;height:34px;border:1px solid rgba(255,255,255,.22);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:#fff;cursor:pointer;transition:all .25s}
  .icon-btn:hover{background:var(--olive);border-color:var(--olive)}
  .cart-pill{position:relative}
  .cart-count{position:absolute;top:-4px;right:-4px;background:var(--olive);color:#fff;font-size:10px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600}

  /* ---- Page transitions ---- */
  .page{animation:fadeIn .5s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---- Generic ---- */
  .container{max-width:1280px;margin:0 auto;padding:0 36px}
  .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--olive);font-weight:500}
  .h-display{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(42px,6vw,86px);line-height:.98;letter-spacing:.01em;text-transform:uppercase}
  .h-section{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(32px,4vw,54px);line-height:1.05;text-transform:uppercase;letter-spacing:.04em}
  .lede{font-size:16px;line-height:1.65;color:var(--grey)}
  .btn{display:inline-flex;align-items:center;gap:14px;background:var(--brown);color:#fff;border:1px solid var(--brown);padding:18px 32px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;transition:all .25s;font-weight:500}
  .btn:hover{background:var(--olive);border-color:var(--olive)}
  .btn.ghost{background:transparent;color:var(--brown)}
  .btn.ghost:hover{background:var(--brown);color:#fff}
  .btn.dark-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
  .btn.dark-ghost:hover{background:#fff;color:var(--brown);border-color:#fff}
  .btn.olive{background:var(--olive);border-color:var(--olive)}
  .btn.olive:hover{background:var(--olive-2);border-color:var(--olive-2)}
  .btn .arr{display:inline-block;width:18px;height:1px;background:currentColor;position:relative}
  .btn .arr::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;border-right:1px solid currentColor;border-top:1px solid currentColor;transform:rotate(45deg)}

  /* placeholder image */
  .img-ph{position:relative;background:
    repeating-linear-gradient(135deg, rgba(122,122,69,.12) 0 8px, transparent 8px 16px),
    linear-gradient(180deg,#2a1610,#3B1F14);
    color:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;border:1px solid rgba(255,255,255,.08)}
  .img-ph.light{background:
    repeating-linear-gradient(135deg, rgba(58,31,20,.08) 0 8px, transparent 8px 16px),
    var(--cream-2);
    color:rgba(58,31,20,.55);border:1px solid rgba(58,31,20,.1)}
  .img-ph .corner{position:absolute;top:10px;left:12px;font-size:10px}
  .img-ph .corner.r{left:auto;right:12px}
  .img-ph .corner.b{top:auto;bottom:10px}

  /* real photo container — same footprint as .img-ph but renders <img> */
  .real-photo{position:relative;overflow:hidden;background:#2a1610}
  .real-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .hero-img.real-photo{aspect-ratio:4/5}

  /* form fields */
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .field label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--olive);font-weight:500}
  .field input,.field select,.field textarea{background:transparent;border:none;border-bottom:1px solid var(--line-dark);padding:10px 0;font-size:15px;color:var(--brown-3);outline:none;transition:border-color .2s;font-family:Inter,sans-serif}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--olive)}
  .field.on-dark input,.field.on-dark select,.field.on-dark textarea{color:#fff;border-color:rgba(255,255,255,.2)}
  .field.on-dark input:focus,.field.on-dark select:focus,.field.on-dark textarea:focus{border-color:var(--olive)}
  .field textarea{resize:vertical;min-height:70px}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(20,12,8,.72);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .25s ease;backdrop-filter:blur(4px)}
  .modal{background:var(--cream);max-width:520px;width:100%;padding:48px 44px;position:relative;border:1px solid var(--line-dark);animation:popUp .35s cubic-bezier(.2,.7,.3,1.2)}
  .modal.dark{background:var(--brown);color:#fff;border-color:rgba(255,255,255,.1)}
  .modal-close{position:absolute;top:16px;right:16px;width:30px;height:30px;border:none;background:transparent;cursor:pointer;font-size:20px;color:inherit;opacity:.6;transition:opacity .2s}
  .modal-close:hover{opacity:1}
  @keyframes popUp{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}

  /* ---- О НАС / hero ---- */
  .hero{background:var(--brown-3);color:#fff;padding:120px 0 100px;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 80% 20%,rgba(122,122,69,.18),transparent 60%)}
  .hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:80px;align-items:center;position:relative;z-index:1}
  .hero h1{margin:18px 0 24px;color:#fff}
  .hero-script{font-family:"Pinyon Script",cursive;color:var(--olive);font-size:46px;line-height:1;margin-top:-10px;display:block}
  .hero p{color:rgba(255,255,255,.72);max-width:480px;font-size:17px;line-height:1.7}
  .hero-actions{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap}
  .hero-img{aspect-ratio:4/5;border-radius:0}
  .hero-meta{display:flex;gap:40px;margin-top:80px;border-top:1px solid var(--line);padding-top:28px;color:rgba(255,255,255,.6);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
  .hero-meta b{display:block;font-family:"Cormorant Garamond",serif;font-size:36px;color:var(--olive);font-weight:600;letter-spacing:0;text-transform:none;margin-bottom:6px}

  /* sections */
  section.band{padding:110px 0}
  section.band.dark{background:var(--brown);color:#fff}
  section.band.cream{background:var(--cream-2)}
  section.band.paper{background:var(--paper)}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
  .two-col .img-ph{aspect-ratio:5/6}

  .feature-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:60px;border-top:1px solid var(--line-dark)}
  section.band.dark .feature-cards{border-color:var(--line)}
  .feature{padding:42px 36px;border-right:1px solid var(--line-dark);border-bottom:1px solid var(--line-dark)}
  section.band.dark .feature{border-color:var(--line)}
  .feature:nth-child(3n){border-right:none}
  .feature .num{font-family:"Cormorant Garamond",serif;font-size:44px;color:var(--olive);font-weight:500;line-height:1;margin-bottom:18px}
  .feature h4{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:0 0 12px}
  .feature p{font-size:14px;line-height:1.6;color:var(--grey);margin:0}
  section.band.dark .feature p{color:rgba(255,255,255,.65)}

  /* ---- Menu ---- */
  .menu-hero{background:var(--brown-3);color:#fff;padding:80px 0 60px}
  .menu-grid{display:grid;grid-template-columns:1.5fr .9fr;gap:60px;padding:80px 0}
  .pkg-list{display:flex;flex-direction:column;gap:0}
  .pkg{display:grid;grid-template-columns:80px 1fr auto auto;gap:24px;align-items:center;padding:28px 0;border-bottom:1px solid var(--line-dark);transition:padding .25s}
  .pkg:hover{padding-left:12px}
  .pkg .pkg-num{font-family:"Cormorant Garamond",serif;font-size:38px;color:var(--olive);font-weight:500;line-height:1}
  .pkg-name{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
  .pkg-desc{font-size:13px;color:var(--grey);line-height:1.5}
  .pkg-price{font-family:"Cormorant Garamond",serif;font-size:28px;font-weight:600;color:var(--brown);white-space:nowrap}
  .pkg-add{background:var(--brown);color:#fff;border:none;padding:14px 18px;cursor:pointer;font-size:11px;letter-spacing:.2em;text-transform:uppercase;transition:all .25s;font-weight:500}
  .pkg-add:hover{background:var(--olive)}

  /* dish picker */
  .picker{background:var(--cream);max-width:840px;width:100%;max-height:88vh;display:flex;flex-direction:column;border:1px solid var(--line-dark);animation:popUp .35s cubic-bezier(.2,.7,.3,1.2)}
  .picker-head{padding:30px 40px 20px;border-bottom:1px solid var(--line-dark);display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
  .picker-head h3{font-family:"Cormorant Garamond",serif;font-size:30px;text-transform:uppercase;letter-spacing:.04em;margin:8px 0 4px;font-weight:600}
  .picker-head .quota{font-size:12px;color:var(--grey);letter-spacing:.04em}
  .picker-head .quota b{font-family:"Cormorant Garamond",serif;font-size:22px;color:var(--brown);font-weight:600;margin:0 4px}
  .picker-cats{display:flex;gap:0;border-bottom:1px solid var(--line-dark);background:var(--paper);overflow-x:auto}
  .pcat{padding:14px 22px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;transition:all .2s}
  .pcat:hover{color:var(--brown)}
  .pcat.active{color:var(--brown);border-bottom-color:var(--olive);background:var(--cream)}
  .pcat .badge{display:inline-block;background:var(--olive);color:#fff;font-size:9px;width:16px;height:16px;line-height:16px;border-radius:50%;margin-left:6px;font-weight:600}
  .picker-body{flex:1;overflow:auto;padding:24px 40px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;background:var(--cream)}
  .dish{display:grid;grid-template-columns:1fr auto;gap:14px;padding:16px 20px;background:#fff;border:1px solid var(--line-dark);align-items:center;cursor:pointer;transition:all .15s}
  .dish:hover{border-color:var(--olive)}
  .dish.picked{background:var(--brown);color:#fff;border-color:var(--brown)}
  .dish.disabled{opacity:.4;cursor:not-allowed}
  .dish .dn{font-family:"Cormorant Garamond",serif;font-size:18px;font-weight:600;letter-spacing:.02em;line-height:1.2}
  .dish .dd{font-size:11px;color:var(--grey);margin-top:4px;line-height:1.4}
  .dish.picked .dd{color:rgba(255,255,255,.6)}
  .dish .dq{display:flex;align-items:center;gap:8px}
  .dish .dq button{width:24px;height:24px;border:1px solid var(--brown);background:transparent;color:var(--brown);cursor:pointer;font-size:14px;line-height:1}
  .dish.picked .dq button{border-color:#fff;color:#fff}
  .picker-foot{padding:20px 40px;border-top:1px solid var(--line-dark);display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--paper)}
  .picker-foot .selected-summary{font-size:12px;color:var(--grey)}
  .picker-foot .selected-summary b{color:var(--brown)}

  .cart-panel{background:var(--brown);color:#fff;padding:36px 32px;position:sticky;top:96px;align-self:start}
  .cart-panel h3{font-family:"Cormorant Garamond",serif;font-size:24px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 20px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:14px}
  .cart-items{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;max-height:240px;overflow:auto}
  .cart-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
  .cart-row .qty{display:flex;align-items:center;gap:6px}
  .qty button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;width:22px;height:22px;cursor:pointer;font-size:14px;line-height:1}
  .cart-empty{color:rgba(255,255,255,.4);font-size:13px;font-style:italic;padding:20px 0;text-align:center}
  .cart-total{display:flex;justify-content:space-between;font-family:"Cormorant Garamond",serif;font-size:26px;border-top:1px solid var(--line);padding-top:18px;margin-bottom:18px}

  /* orders */
  .orders-section{background:var(--cream-2);padding:80px 0}
  .order-card{background:#fff;padding:24px 28px;margin-bottom:14px;border-left:3px solid var(--olive);display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center}
  .order-status{display:inline-flex;gap:0;border:1px solid var(--line-dark)}
  .stat-step{padding:6px 12px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey);border-right:1px solid var(--line-dark);transition:all .3s}
  .stat-step:last-child{border-right:none}
  .stat-step.active{background:var(--olive);color:#fff}
  .stat-step.done{background:var(--brown);color:#fff}

  /* ---- Бронирование floor map ---- */
  .booking-hero{padding:90px 0 60px;background:var(--brown-3);color:#fff;text-align:center}
  .booking-hero h1{margin:14px 0 22px;color:#fff}
  .booking-hero p{max-width:620px;margin:0 auto 32px;color:rgba(255,255,255,.72);font-size:16px;line-height:1.6}
  .map-wrap{padding:50px 0 100px;background:var(--cream-2)}
  .legend{display:flex;gap:28px;justify-content:center;margin-bottom:30px;flex-wrap:wrap}
  .leg-item{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey)}
  .leg-swatch{width:18px;height:18px;border:1px solid var(--brown)}
  .leg-swatch.table{background:#fff}
  .leg-swatch.room{background:var(--olive);border-color:var(--olive)}
  .leg-swatch.busy{background:var(--brown-2);border-color:var(--brown-2)}
  .floor-svg{width:100%;max-width:1100px;margin:0 auto;display:block;background:var(--paper);border:1px solid var(--line-dark)}
  .floor-svg .table-shape{fill:#fff;stroke:var(--brown);stroke-width:1.5;cursor:pointer;transition:all .2s}
  .floor-svg .table-shape:hover{fill:var(--cream-2)}
  .floor-svg .table-shape.busy{fill:var(--brown-2);stroke:var(--brown-2);cursor:not-allowed}
  .floor-svg .room-shape{fill:rgba(122,122,69,.18);stroke:var(--olive);stroke-width:1.5;cursor:pointer;transition:all .2s}
  .floor-svg .room-shape:hover{fill:rgba(122,122,69,.4)}
  .floor-svg .room-shape.busy{fill:var(--brown-2);stroke:var(--brown-2);cursor:not-allowed;opacity:.5}
  .floor-svg text{font-family:"JetBrains Mono",monospace;font-size:11px;fill:var(--brown);pointer-events:none;text-anchor:middle;letter-spacing:.1em}
  .floor-svg text.on-room{fill:var(--brown);font-weight:500}
  .floor-svg .wall{fill:none;stroke:var(--brown);stroke-width:2}
  .floor-svg .grid-line{stroke:var(--line-dark);stroke-width:.5}

  /* ---- Конструктор ---- */
  .builder-hero{padding:90px 0;background:var(--brown);color:#fff;text-align:center}
  .builder-steps{display:flex;justify-content:center;gap:0;border-top:1px solid var(--line-dark);border-bottom:1px solid var(--line-dark);background:var(--paper)}
  .step-tab{flex:1;padding:22px 16px;text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);border-right:1px solid var(--line-dark);position:relative}
  .step-tab:last-child{border-right:none}
  .step-tab.current{background:var(--cream);color:var(--brown);font-weight:600}
  .step-tab.done{color:var(--olive)}
  .step-tab .step-num{font-family:"Cormorant Garamond",serif;font-size:22px;display:block;margin-bottom:4px;color:var(--olive)}
  .step-tab.current .step-num{color:var(--brown)}
  .builder-body{padding:70px 0 90px;background:var(--cream)}
  .builder-card{max-width:880px;margin:0 auto;background:#fff;padding:50px 56px;border:1px solid var(--line-dark)}
  .builder-card h2{font-family:"Cormorant Garamond",serif;font-size:36px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px;font-weight:600}
  .builder-card .step-desc{color:var(--grey);font-size:14px;margin-bottom:30px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .room-opt,.equip-opt{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:18px 22px;border:1px solid var(--line-dark);margin-bottom:10px;cursor:pointer;transition:all .2s;background:#fff}
  .room-opt:hover,.equip-opt:hover{border-color:var(--olive);background:var(--paper)}
  .room-opt.selected{border-color:var(--brown);background:var(--brown);color:#fff}
  .room-opt.selected .pkg-price{color:#fff}
  .room-opt .pkg-price{font-size:22px}
  .check-square{width:20px;height:20px;border:1.5px solid var(--brown);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .check-square.on{background:var(--brown);color:#fff}
  .room-opt.selected .check-square{border-color:#fff;background:#fff;color:var(--brown)}
  .qty-input{width:60px;border:1px solid var(--line-dark);padding:6px 8px;font-size:14px;text-align:center}
  .builder-nav{display:flex;justify-content:space-between;margin-top:40px;gap:12px}
  .price-display{background:var(--brown);color:#fff;padding:30px 36px;display:flex;justify-content:space-between;align-items:center;margin-top:30px}
  .price-display .label{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.6)}
  .price-display .price{font-family:"Cormorant Garamond",serif;font-size:42px;font-weight:600}

  /* ---- Контакты ---- */
  .contacts-page{padding:0}
  .contacts-grid{display:grid;grid-template-columns:1fr 1.2fr;min-height:80vh}
  .contacts-info{background:var(--brown-3);color:#fff;padding:90px 80px;display:flex;flex-direction:column;justify-content:center}
  .contacts-info h1{color:#fff;margin:14px 0 40px}
  .contact-row{padding:28px 0;border-bottom:1px solid var(--line)}
  .contact-row:first-of-type{border-top:1px solid var(--line)}
  .contact-row .lab{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--olive);margin-bottom:8px}
  .contact-row .val{font-family:"Cormorant Garamond",serif;font-size:28px;font-weight:500}
  .contact-row .val a:hover{color:var(--olive)}
  .socials{display:flex;gap:14px;margin-top:36px}

// User context — current authenticated user available everywhere
const UserCtx = React.createContext(null);

function CartProvider({ children, user, setUser }) {
  const [items, setItems] = useState([]);
  // Per-user orders: pulled from ACCOUNTS_DB[email].orders. Guest orders kept in local state.
  const [guestOrders, setGuestOrders] = useState([]);
  // tick to force re-render when ACCOUNTS_DB orders change
  const [, force] = useState(0);

  const orders = user && user.email ?
  ACCOUNTS_DB[user.email]?.orders || [] :
  guestOrders;

  // Auto-progress order statuses for realism (simulates real-time)
  useEffect(() => {
    const STAGES = ['accepted', 'preparing', 'ontable', 'closed'];
    const t = setInterval(() => {
      let changed = false;
      Object.values(ACCOUNTS_DB).forEach((acc) => {
        if (!acc.orders) return;
        acc.orders.forEach((o) => {
          if (o.status === 'closed') return;
          // 30% chance per tick to advance
          if (Math.random() < 0.25) {
            const i = STAGES.indexOf(o.status);
            if (i >= 0 && i < STAGES.length - 1) {
              o.status = STAGES[i + 1];
              changed = true;
            }
          }
        });
      });
      if (changed) force((n) => n + 1);
    }, 8000);
    return () => clearInterval(t);
  }, []);

  const add = (pkg) => setItems((prev) => {
    const key = pkg.cartKey || pkg.id;
    const ex = prev.find((p) => (p.cartKey || p.id) === key);
    if (ex) return prev.map((p) => (p.cartKey || p.id) === key ? { ...p, qty: p.qty + 1 } : p);
    return [...prev, { ...pkg, cartKey: key, qty: 1 }];
  });
  const inc = (key) => setItems((prev) => prev.map((p) => (p.cartKey || p.id) === key ? { ...p, qty: p.qty + 1 } : p));
  const dec = (key) => setItems((prev) => prev.flatMap((p) => (p.cartKey || p.id) === key ? p.qty > 1 ? [{ ...p, qty: p.qty - 1 }] : [] : [p]));
  const total = items.reduce((s, p) => s + p.price * p.qty, 0);

  const placeOrder = (table, comment, requests) => {
    if (!items.length) return null;
    const id = Math.floor(1000 + Math.random() * 9000);
    const now = new Date();
    const ord = {
      id,
      items: [...items],
      total,
      status: 'accepted',
      table,
      comment,
      requests,
      when: now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
      date: now.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' }),
      timestamp: now.getTime(),
      ownerEmail: user?.email || null
    };
    if (user && user.email) {
      const acc = ACCOUNTS_DB[user.email];
      if (acc) {
        acc.orders = acc.orders || [];
        acc.orders.unshift(ord);
        force((n) => n + 1);
      }
    } else {
      setGuestOrders((prev) => [ord, ...prev]);
    }
    setItems([]);
    return ord;
  };

  return (
    <CartCtx.Provider value={{ items, add, inc, dec, total, orders, placeOrder, user }}>
      {children}
    </CartCtx.Provider>);

}
const useCart = () => React.useContext(CartCtx);

function Modal({ open, onClose, dark, children, maxWidth }) {
  if (!open) return null;
  return (
    <div className="modal-bg" onClick={onClose}>

        {children}
      </div>
    </div>);

}

// ============== DISH PICKER ==============
function DishPicker({ pkg, onClose, onConfirm }) {
  const [cat, setCat] = React.useState(pkg.drinks > 0 ? 'drinks' : 'breakfast');
  const [picks, setPicks] = React.useState([]); // [{id,name,catId}]

  const drinkLimit = pkg.drinks || 0;
  const dishLimit = pkg.dishes || 0;
  const drinkCount = picks.filter((p) => p.catId === 'drinks').length;
  const dishCount = picks.filter((p) => p.catId !== 'drinks').length;

  // count picks by category for badges
  const countByCat = {};
  picks.forEach((p) => {countByCat[p.catId] = (countByCat[p.catId] || 0) + 1;});

  const isPicked = (id) => picks.find((p) => p._uid === id);
  const toggle = (dish, catId) => {
    const uid = catId + ':' + dish.id + ':' + Date.now() + Math.random();
    setPicks((prev) => {
      // For "Добавить блюдо" — only one item allowed at a time
      if (pkg.anyCat) {
        return [{ ...dish, catId, _uid: uid }];
      }
      // remove if already picked (find by id+catId, latest one)
      const existingIdx = prev.findIndex((p) => p.id === dish.id && p.catId === catId);
      if (existingIdx >= 0) {
        return prev.filter((_, i) => i !== existingIdx);
      }
      // add — but enforce limits
      if (catId === 'drinks') {
        if (drinkCount >= drinkLimit) return prev;
      } else {
        if (dishCount >= dishLimit) return prev;
      }
      return [...prev, { ...dish, catId, _uid: uid }];
    });
  };

  const canAddInCat = (catId) => {
    if (pkg.anyCat) return picks.length === 0;
    if (catId === 'drinks') return drinkCount < drinkLimit;
    return dishCount < dishLimit;
  };

  const ready = pkg.anyCat ?
  picks.length === 1 :
  drinkCount === drinkLimit && dishCount === dishLimit;

  const cats = pkg.anyCat ?
  DISH_CATS // all categories available
  : DISH_CATS;

  const curCat = cats.find((c) => c.id === cat);

  const confirm = () => {
    const cartKey = pkg.id + ':' + picks.map((p) => p.catId + '-' + p.id).sort().join('|');
    onConfirm({ ...pkg, picks, cartKey });
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="picker" onClick={(e) => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>×</button>
        <div className="picker-head">
          <div>
            <span className="eyebrow">{pkg.num} · комплекс</span>
            <h3>{pkg.name}</h3>
            <div className="quota">{pkg.desc}</div>
          </div>
          <div className="quota" style={{ textAlign: 'right' }}>
            {pkg.anyCat ?
            <>выбрано <b>{picks.length}</b>/ <b>1</b></> :

            <>напитков <b>{drinkCount}</b>/<b>{drinkLimit}</b> · блюд <b>{dishCount}</b>/<b>{dishLimit}</b></>
            }
          </div>
        </div>
        <div className="picker-cats">
          {cats.map((c) => {
            // hide drinks tab if package has no drinks slot AND not anyCat
            if (c.id === 'drinks' && !pkg.anyCat && drinkLimit === 0) return null;
            return (
              <button key={c.id} className={"pcat " + (cat === c.id ? 'active' : '')} onClick={() => setCat(c.id)}>
                {c.label}
                {countByCat[c.id] > 0 && <span className="badge">{countByCat[c.id]}</span>}
              </button>);

          })}
        </div>
        <div className="picker-body">
          {curCat && curCat.dishes.map((d) => {
            const picked = picks.find((p) => p.id === d.id && p.catId === cat);
            const canAdd = canAddInCat(cat);
            const disabled = !picked && !canAdd;
            return (
              <div key={d.id} className={"dish " + (picked ? 'picked' : '') + (disabled ? ' disabled' : '')} onClick={() => !disabled && toggle(d, cat)}>
                <div>
                  <div className="dn">{d.name}</div>
                  <div className="dd">{d.desc}</div>
                </div>
                <div className="dq">{picked ? '✓' : '+'}</div>
              </div>);

          })}
        </div>
        <div className="picker-foot">
          <div className="selected-summary">
            {picks.length === 0 ? 'Ничего не выбрано' :
            <>Выбрано: <b>{picks.map((p) => p.name).join(', ')}</b></>
            }
          </div>
          <div style={{ display: 'flex', gap: 10 }}>
            <button className="btn ghost" onClick={onClose}>Отмена</button>
            <button className="btn olive" onClick={confirm} disabled={!ready} style={{ opacity: ready ? 1 : .4 }}>В корзину · {pkg.price} ₽ <span className="arr"></span></button>
          </div>
        </div>
      </div>
    </div>);

}

{ id: 'video', name: 'Видеосъёмка', price: 12000 },
{ id: 'brand', name: 'Брендинг площадки', price: 8000 }];


function BuilderPage() {
  const [started, setStarted] = useState2(false);
  const [step, setStep] = useState2(0);
  const [data, setData] = useState2({
    date: '', time: '', endTime: '', people: 8, theme: '',
    room: null,
    equip: {},
    catering: {},
    extras: {},
    extrasOther: ''
  });
  const [calculated, setCalculated] = useState2(false);
  const [success, setSuccess] = useState2(false);

  const reset = () => {setStarted(false);setStep(0);setCalculated(false);setData({ date: '', time: '', endTime: '', people: 8, theme: '', room: null, equip: {}, catering: {}, extras: {}, extrasOther: '' });};

  const set = (patch) => setData((d) => ({ ...d, ...patch }));
  const toggleEquip = (id) => setData((d) => {
    const has = d.equip[id];
    const next = { ...d.equip };
    if (has) delete next[id];else next[id] = 1;
    return { ...d, equip: next };
  });
  const setEquipQty = (id, q) => setData((d) => ({ ...d, equip: { ...d.equip, [id]: Math.max(1, q) } }));
  const toggleCatering = (id) => setData((d) => {
    const next = { ...d.catering };
    if (next[id]) delete next[id];else next[id] = d.people;
    return { ...d, catering: next };
  });
  const toggleExtra = (id) => setData((d) => {
    const next = { ...d.extras };
    if (next[id]) delete next[id];else next[id] = 1;
    return { ...d, extras: next };
  });

  const hours = (() => {
    if (!data.time || !data.endTime) return 0;
    const [h1, m1] = data.time.split(':').map(Number);
    const [h2, m2] = data.endTime.split(':').map(Number);
    let diff = h2 * 60 + m2 - (h1 * 60 + m1);
    if (diff <= 0) diff += 24 * 60;
    return diff / 60;
  })();

  // Пакетные цены аренды: 1ч=600, 3ч=1600, 5ч=2500 — жадно от большего пакета
  const roomBreakdown = (h) => {
    let n = Math.ceil(h);
    const out = [];
    while (n >= 5) {out.push({ pkg: '5 ч', price: 2500 });n -= 5;}
    while (n >= 3) {out.push({ pkg: '3 ч', price: 1600 });n -= 3;}
    while (n >= 1) {out.push({ pkg: '1 ч', price: 600 });n -= 1;}
    const grp = {};
    out.forEach((o) => {if (!grp[o.pkg]) grp[o.pkg] = { ...o, count: 0 };grp[o.pkg].count += 1;});
    return Object.values(grp);
  };
  const roomCost = (h) => roomBreakdown(h).reduce((s, x) => s + x.price * x.count, 0);

  const STAFF_PRICE = 40000;

  const total = (() => {
    let s = STAFF_PRICE;
    if (data.room && !data.room.custom) s += roomCost(Math.max(1, hours));
    Object.entries(data.equip).forEach(([id, q]) => {
      const e = EQUIP.find((x) => x.id === id);if (e) s += e.price * q;
    });
    Object.entries(data.catering).forEach(([id, n]) => {
      const c = CATERING.find((x) => x.id === id);if (c) s += c.price * n;
    });
    Object.entries(data.extras).forEach(([id]) => {
      const x = EXTRAS.find((x) => x.id === id);if (x) s += x.price;
    });
    return s;
  })();

  const STEPS = ['Параметры', 'Комната', 'Оборудование', 'Питание', 'Дополнительно', 'Финал'];
  const next = () => setStep((s) => Math.min(5, s + 1));
  const back = () => setStep((s) => Math.max(0, s - 1));

  const filteredRooms = BUILDER_ROOMS.filter((r) => r.cap >= (Number(data.people) || 0));

  if (!started) {
    return (
      <div className="page" data-screen-label="04 Конструктор мероприятий">
        <div className="builder-hero">
          <div className="container">
            <span className="eyebrow" style={{ color: '#7A7A45' }}>Конструктор мероприятий</span>
            <h1 className="h-display" style={{ margin: '14px 0 22px' }}>СОБЕРИТЕ СВОЕ
СОБЫТИЕ<br /></h1>
            <p style={{ maxWidth: 680, margin: '0 auto 32px', color: 'rgba(255,255,255,.72)', lineHeight: 1.7, fontSize: 16 }}>
              Оставьте Вашу заявку, а наш организатор свяжется с Вами в течение суток для уточнения деталей
            </p>
            <button className="btn olive" onClick={() => setStarted(true)}>Собрать мероприятие <span className="arr"></span></button>
          </div>
        </div>

        <section className="band paper">
          <div className="container">
            <span className="eyebrow">Как это работает</span>
            <h2 className="h-section" style={{ margin: '14px 0 0' }}>Пять шагов</h2>
            <div className="feature-cards">
              {[
              { n: '01', t: 'Параметры', d: 'Выберите дату, время, количесво участников и тематику мероприятия' },
              { n: '02', t: 'Комната', d: 'Наш сервис подберет подходящее по вместимости пространство' },
              { n: '03', t: 'Оборудование', d: 'Укажите необходимое оборудование и дополнительные услуги (микрофоны, камеры, синхронный перевод и др.)' },
              { n: '04', t: 'Питание', d: 'Определите уровень и объем питания на каждого участника' },
              { n: '05', t: 'Сервисы', d: 'Выберите дополнительные услуги (фото, видео, брендинг или под индивидуальный запрос)' },
              { n: 'Финал', t: 'Расчёт', d: 'Мы рассчитаем предварительную стоимость' }].
              map((f, i) =>
              <div key={f.n} className="feature" style={i >= 3 ? { borderBottom: 'none' } : null}>
                  <div className="num" style={{ fontSize: "40px" }}>{f.n}</div>
                  <h4>{f.t}</h4>
                  <p>{f.d}</p>
                </div>
              )}
            </div>
          </div>
        </section>
      </div>);

  }

  return (
    <div className="page" data-screen-label="04 Конструктор · сборка">
      <div className="builder-steps">
        {STEPS.map((s, i) =>
        <div key={s} className={"step-tab " + (step === i ? 'current' : step > i ? 'done' : '')}>
            <span className="step-num">0{i + 1}</span>
          </div>
        )}
      </div>
      <div className="builder-body">
        <div className="builder-card">
          {step === 0 &&
          <>
              <span className="eyebrow">Шаг 1</span>
              <h2>Параметры события</h2>
              <p className="step-desc">Базовая информация — она определит подбор комнаты и питания</p>
              <div className="form-row">
                <div className="field"><label>Дата</label><input type="date" value={data.date} onChange={(e) => set({ date: e.target.value })} /></div>
                <div className="field"><label>Время начала</label><input type="time" value={data.time} onChange={(e) => set({ time: e.target.value })} /></div>
              </div>
              <div className="form-row">
                <div className="field"><label>Время окончания</label><input type="time" value={data.endTime} onChange={(e) => set({ endTime: e.target.value })} /></div>
                <div className="field"><label>Количество участников</label><input type="number" min="2" value={data.people} onChange={(e) => set({ people: e.target.value })} /></div>
              </div>
              <div className="form-row">
                <div className="field" style={{ gridColumn: '1 / -1' }}><label>Тематика мероприятия</label><input value={data.theme} onChange={(e) => set({ theme: e.target.value })} placeholder="например, стратегическая сессия" /></div>
              </div>
            </>
          }

          {step === 1 &&
          <>
              <span className="eyebrow">Шаг 2</span>
              <h2>Выбор комнаты</h2>
              <p className="step-desc">Доступные пространства для {data.people || '—'} участников</p>
              {filteredRooms.length === 0 && <div className="lede">Под указанное число участников нет комнат. Попробуйте уменьшить значение</div>}
              {filteredRooms.map((r) =>
            <div key={r.id} className={"room-opt" + (data.room?.id === r.id ? ' selected' : '')} onClick={() => set({ room: r })}>
                  <div className={"check-square" + (data.room?.id === r.id ? ' on' : '')}>{data.room?.id === r.id ? '✓' : ''}</div>
                  <div>
                    <div style={{ fontFamily: '"Cormorant Garamond",serif', fontSize: 24, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.04em' }}>{r.name}</div>
                    {!r.custom && <div style={{ fontSize: 12, opacity: .75, marginTop: 4 }}>до {r.cap} человек</div>}
                    {r.custom && <div style={{ fontSize: 12, opacity: .75, marginTop: 4 }}>обсудим параметры с организатором</div>}
                  </div>
                  <div className="pkg-price">{r.custom ? 'по запросу' : '600 ₽/ч · пакеты от 1 600 ₽'}</div>
                </div>
            )}
              {data.room && !data.room.custom && hours > 0 &&
            <div style={{ marginTop: 14, padding: '14px 18px', background: 'var(--cream-2)', fontSize: 13, color: '#4A4A4A', borderLeft: '3px solid var(--olive)' }}>
                  Аренда зала «{data.room.name}» на {Math.ceil(hours)} ч — <b>{roomCost(Math.max(1, hours)).toLocaleString('ru-RU')} ₽</b>
                  <div style={{ fontSize: 11, color: '#7A7A45', marginTop: 6, letterSpacing: '.12em', textTransform: 'uppercase', display: 'grid', gap: 4 }}>
                    {roomBreakdown(Math.max(1, hours)).flatMap((b) => Array.from({ length: b.count }).map((_, i) =>
                <div key={b.pkg + i}>пакет «{b.pkg}» · {b.price.toLocaleString('ru-RU')} ₽</div>
                ))}
                  </div>
                </div>
            }
            </>
          }

          {step === 2 &&
          <>
              <span className="eyebrow">Шаг 3</span>
              <h2>Оборудование</h2>
              <p className="step-desc">Отметьте необходимое и укажите количество</p>
              {EQUIP.map((e) => {
              const on = !!data.equip[e.id];
              return (
                <div key={e.id} className="equip-opt">
                    <div className={"check-square" + (on ? ' on' : '')} onClick={() => toggleEquip(e.id)} style={{ cursor: 'pointer' }}>{on ? '✓' : ''}</div>
                    <div>
                      <div style={{ fontFamily: '"Cormorant Garamond",serif', fontSize: 20, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.04em' }}>{e.name}</div>
                      <div style={{ fontSize: 12, color: '#4A4A4A', marginTop: 4 }}>{e.price.toLocaleString('ru-RU')} ₽ за единицу</div>
                    </div>
                    {on && <input className="qty-input" type="number" min="1" value={data.equip[e.id]} onChange={(ev) => setEquipQty(e.id, Number(ev.target.value))} />}
                    {!on && <span style={{ color: '#7A7A45', fontSize: 11, letterSpacing: '.18em', textTransform: 'uppercase' }}>не выбрано</span>}
                  </div>);

            })}
            </>
          }

          {step === 3 &&
          <>
              <span className="eyebrow">Шаг 4</span>
              <h2>Питание</h2>
              <p className="step-desc">Будет рассчитано на {data.people} участников. Можно выбрать несколько форматов</p>
              {CATERING.map((c) => {
              const on = !!data.catering[c.id];
              return (
                <div key={c.id} className="equip-opt">
                    <div className={"check-square" + (on ? ' on' : '')} onClick={() => toggleCatering(c.id)} style={{ cursor: 'pointer' }}>{on ? '✓' : ''}</div>
                    <div>
                      <div style={{ fontFamily: '"Cormorant Garamond",serif', fontSize: 20, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.04em' }}>{c.name}</div>
                      <div style={{ fontSize: 12, color: '#4A4A4A', marginTop: 4 }}>{c.desc}</div>
                      <div style={{ fontSize: 11, color: '#7A7A45', marginTop: 4, letterSpacing: '.12em', textTransform: 'uppercase' }}>{c.price.toLocaleString('ru-RU')} ₽ × {c.per}</div>
                    </div>
                    <div className="pkg-price">{on ? (c.price * data.catering[c.id]).toLocaleString('ru-RU') + ' ₽' : '—'}</div>
                  </div>);

            })}
            </>
          }

          {step === 4 &&
          <>
              <span className="eyebrow">Шаг 5</span>
              <h2>Дополнительные услуги</h2>
              <p className="step-desc">Фото, видео, брендинг и индивидуальные запросы</p>
              {EXTRAS.map((x) => {
              const on = !!data.extras[x.id];
              return (
                <div key={x.id} className="equip-opt">
                    <div className={"check-square" + (on ? ' on' : '')} onClick={() => toggleExtra(x.id)} style={{ cursor: 'pointer' }}>{on ? '✓' : ''}</div>
                    <div>
                      <div style={{ fontFamily: '"Cormorant Garamond",serif', fontSize: 20, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.04em' }}>{x.name}</div>
                      <div style={{ fontSize: 12, color: '#4A4A4A', marginTop: 4 }}>фиксированная стоимость</div>
                    </div>
                    <div className="pkg-price">{x.price.toLocaleString('ru-RU')} ₽</div>
                  </div>);

            })}
              <div className="field" style={{ marginTop: 20 }}>
                <label>Другое — опишите запрос</label>
                <textarea value={data.extrasOther} onChange={(e) => set({ extrasOther: e.target.value })} placeholder="например, оформление зоны для нетворкинга" />
              </div>
            </>
          }

          {step === 5 &&
          <>
              <span className="eyebrow">Финал</span>
              <h2>Итоговый расчёт</h2>
              <p className="step-desc">Обязательная позиция в любой заявке</p>
              <div className="equip-opt" style={{ cursor: 'default' }}>
                <div className="check-square on">✓</div>
                <div>
                  <div style={{ fontFamily: '"Cormorant Garamond",serif', fontSize: 20, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.04em' }}>Работа персонала</div>
                  <div style={{ fontSize: 12, color: '#4A4A4A', marginTop: 4 }}>Организатор, официанты и техническая поддержка на время мероприятия</div>
                  <div style={{ fontSize: 11, color: '#7A7A45', marginTop: 4, letterSpacing: '.12em', textTransform: 'uppercase' }}>фиксированная стоимость</div>
                </div>
                <div className="pkg-price">от 40 000 ₽</div>
              </div>
              {calculated &&
            <div className="price-display">
                  <div>
                    <div className="label">Предварительная стоимость</div>
                    <div style={{ fontSize: 11, color: 'rgba(255,255,255,.5)', marginTop: 6 }}>Финальная цена согласовывается с организатором</div>
                  </div>
                  <div className="price">{total.toLocaleString('ru-RU')} ₽</div>
                </div>
            }
            </>
          }

          <div className="builder-nav">
            <div style={{ display: 'flex', gap: 8 }}>
              {step > 0 && <button className="btn ghost" onClick={back}>← Назад</button>}
              <button className="btn ghost" onClick={reset}>Отменить</button>
            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              {step < 5 && <button className="btn" onClick={next}>Далее <span className="arr"></span></button>}
              {step === 5 && !calculated && <button className="btn" onClick={() => setCalculated(true)}>Запросить расчёт <span className="arr"></span></button>}
              {step === 5 && calculated && <button className="btn olive" onClick={() => {setSuccess(true);}}>Отправить заявку <span className="arr"></span></button>}
            </div>
          </div>
        </div>
      </div>

      <SuccessModal open={success} onClose={() => {setSuccess(false);reset();}} title="Заявка отправлена" body="В течение суток с Вами свяжется наш организатор для подтверждения деталей мероприятия." />
    </div>);

}

// Simulated account database (resets on reload)
const _ACCS_DEFAULTS = {
  'demo@kafress.ru': { pass: 'demo1234', full: 'Иван Петров', company: 'ООО «Стратегия»', position: 'CEO', phone: '+7 921 555-12-34', emailContact: 'ivan@strategy.ru', loyalty: 2480 }
};
const _ACCS_STORED = (() => { try { return JSON.parse(localStorage.getItem('kafress_accounts') || 'null'); } catch(e) { return null; } })();
const ACCOUNTS_DB = window.__accountsDB || (window.__accountsDB = Object.assign({}, _ACCS_DEFAULTS, _ACCS_STORED || {}));

function persistAccounts() {
  try {
    const snap = {};
    Object.entries(ACCOUNTS_DB).forEach(([k, v]) => {
      snap[k] = { pass: v.pass, full: v.full, company: v.company, position: v.position, phone: v.phone || '', emailContact: v.emailContact || '', loyalty: v.loyalty || 0 };
    });
    localStorage.setItem('kafress_accounts', JSON.stringify(snap));
  } catch(e) {}
}

function RegisterModal({ onClose, onRegistered, openRecover }) {
  const [stage, setStage] = useState2('form'); // form | code | exists
  const [email, setEmail] = useState2('');
  const [pass, setPass] = useState2('');
  const [pass2, setPass2] = useState2('');
  const [err, setErr] = useState2('');
  const [code, setCode] = useState2('');
  const [sentCode, setSentCode] = useState2('');
  const [codeErr, setCodeErr] = useState2('');

  const submitForm = (e) => {
    e.preventDefault();
    setErr('');
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    if (!emailOk) {setErr('Введите корректный e-mail');return;}
    if (pass.length < 8) {setErr('Пароль должен быть не менее 8 символов');return;}
    if (pass !== pass2) {setErr('Пароли не совпадают');return;}
    if (ACCOUNTS_DB[email.toLowerCase()]) {
      setStage('exists');
      return;
    }
    // simulate sending code
    const c = String(Math.floor(100000 + Math.random() * 900000));
    setSentCode(c);
    setStage('code');
  };

  const submitCode = (e) => {
    e.preventDefault();
    setCodeErr('');
    if (code.trim() !== sentCode) {setCodeErr('Неверный код. Попробуйте ещё раз.');return;}
    // create account
    ACCOUNTS_DB[email.toLowerCase()] = { pass, full: 'Новый пользователь', company: '—', position: '—', loyalty: 0 };
    persistAccounts();
    onRegistered(email.toLowerCase());
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 480 }}>
        <button className="modal-close" onClick={onClose}>×</button>
        {stage === 'form' &&
        <>
            <span className="eyebrow">Регистрация</span>
            <h3 style={{ fontFamily: '"Cormorant Garamond",serif', fontSize: 32, textTransform: 'uppercase', letterSpacing: '.04em', margin: '10px 0 6px', fontWeight: 600 }}>Создать аккаунт</h3>
            <p style={{ color: '#4A4A4A', fontSize: 13, marginBottom: 24 }}>На указанную почту придёт код подтверждения.</p>
            <form onSubmit={submitForm}>
              <div className="field"><label>E-mail</label><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required placeholder="ivan@company.ru" /></div>
              <div className="field"><label>Пароль (мин. 8 символов)</label><input type="password" value={pass} onChange={(e) => setPass(e.target.value)} required minLength={8} placeholder="••••••••" /></div>
              <div className="field"><label>Повторите пароль</label><input type="password" value={pass2} onChange={(e) => setPass2(e.target.value)} required minLength={8} placeholder="••••••••" /></div>

function RecoverModal({ initialEmail, onClose, onDone }) {
  const [stage, setStage] = useState2('form'); // form | code | newpass
  const [email, setEmail] = useState2(initialEmail || '');
  const [code, setCode] = useState2('');
  const [sentCode, setSentCode] = useState2('');
  const [newPass, setNewPass] = useState2('');
  const [newPass2, setNewPass2] = useState2('');
  const [err, setErr] = useState2('');

  const sendCode = (e) => {
    e.preventDefault();setErr('');
    if (!ACCOUNTS_DB[email.toLowerCase()]) {setErr('Аккаунт с таким e-mail не найден');return;}
    const c = String(Math.floor(100000 + Math.random() * 900000));
    setSentCode(c);setStage('code');
  };
  const checkCode = (e) => {
    e.preventDefault();setErr('');
    if (code.trim() !== sentCode) {setErr('Неверный код');return;}
    setStage('newpass');
  };
  const setNew = (e) => {
    e.preventDefault();setErr('');
    if (newPass.length < 8) {setErr('Пароль должен быть не менее 8 символов');return;}
    if (newPass !== newPass2) {setErr('Пароли не совпадают');return;}
    ACCOUNTS_DB[email.toLowerCase()].pass = newPass;
    persistAccounts();
    onDone(email.toLowerCase());
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 480 }}>
        <button className="modal-close" onClick={onClose}>×</button>
        <span className="eyebrow">Восстановление пароля</span>
        <h3 style={{ fontFamily: '"Cormorant Garamond",serif', fontSize: 30, textTransform: 'uppercase', letterSpacing: '.04em', margin: '10px 0 18px', fontWeight: 600 }}>
          {stage === 'form' && 'Введите e-mail'}
          {stage === 'code' && 'Код подтверждения'}
          {stage === 'newpass' && 'Новый пароль'}
        </h3>
        {stage === 'form' &&
        <form onSubmit={sendCode}>
            <div className="field"><label>E-mail</label><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required /></div>
            {err && <div style={{ color: '#a33', fontSize: 12, margin: '4px 0 12px' }}>{err}</div>}
            <button className="btn" style={{ width: '100%', justifyContent: 'center', marginTop: 10 }}>Отправить код <span className="arr"></span></button>
          </form>
        }
        {stage === 'code' &&
        <form onSubmit={checkCode}>
            <p style={{ color: '#4A4A4A', fontSize: 13, marginBottom: 10 }}>Код отправлен на <b>{email}</b>.</p>
            <div style={{ background: 'rgba(122,122,69,.12)', padding: '10px 14px', fontSize: 11, color: '#5E5E33', letterSpacing: '.1em', marginBottom: 18, fontFamily: '"JetBrains Mono",monospace' }}>demo · код: {sentCode}</div>
            <div className="field"><label>Код</label><input value={code} onChange={(e) => setCode(e.target.value)} required style={{ fontFamily: '"JetBrains Mono",monospace', fontSize: 22, letterSpacing: '.4em' }} /></div>
            {err && <div style={{ color: '#a33', fontSize: 12, margin: '4px 0 12px' }}>{err}</div>}
            <button className="btn olive" style={{ width: '100%', justifyContent: 'center', marginTop: 10 }}>Подтвердить <span className="arr"></span></button>
          </form>
        }
        {stage === 'newpass' &&
        <form onSubmit={setNew}>
            <div className="field"><label>Новый пароль</label><input type="password" value={newPass} onChange={(e) => setNewPass(e.target.value)} required minLength={8} /></div>
            <div className="field"><label>Повторите</label><input type="password" value={newPass2} onChange={(e) => setNewPass2(e.target.value)} required minLength={8} /></div>
            {err && <div style={{ color: '#a33', fontSize: 12, margin: '4px 0 12px' }}>{err}</div>}
            <button className="btn olive" style={{ width: '100%', justifyContent: 'center', marginTop: 10 }}>Сохранить и войти <span className="arr"></span></button>
          </form>
        }
      </div>
    </div>);

}

                <div className="chat-head">
                  <span>{cur ? cur.name : '—'}</span>
                  <span style={{ fontSize: 10, color: '#7A7A45', letterSpacing: '.16em', fontFamily: 'Inter,sans-serif' }}>{cur && cur.kind === 'group' ? 'групповой чат' : 'личный чат'}</span>
                </div>
                <div className="chat-body">
                  {cur && cur.messages.map((m, i) =>
                <div key={i} className={"bubble " + (m.me ? 'me' : 'them')}>
                      {!m.me && <div className="nm">{m.from}</div>}
                      {m.text}
                    </div>
                )}
                  {cur && !cur.messages.length && <div style={{ textAlign: 'center', color: '#7A7A45', fontSize: 12, marginTop: 40 }}>Начните диалог</div>}
                </div>
                <div className="chat-input">
                  <input value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && sendMsg()} placeholder="Сообщение…" />
                  <button onClick={sendMsg}>Отправить</button>
                </div>
              </div>
            </div>
          </>
        }
      </main>
    </div>);

}

// ============== ROOT APP ==============
function App() {
  const [route, setRoute] = useState2(() => {
    const h = window.location.hash.replace('#', '');
    return ['about', 'menu', 'booking', 'builder', 'contacts', 'account'].includes(h) ? h : 'about';
  });
  const [user, setUser] = useState2(null);

  useEffect2(() => {
    const onHash = () => {
      const h = window.location.hash.replace('#', '');
      if (['about', 'menu', 'booking', 'builder', 'contacts', 'account'].includes(h)) setRoute(h);
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const go = (r) => {
    window.location.hash = r;
    setRoute(r);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  return (
    <CartProvider user={user} setUser={setUser}>
      <Header route={route} go={go} user={user} />
      {route === 'about' && <AboutPage go={go} />}
      {route === 'menu' && <MenuPage go={go} />}
      {route === 'booking' && <BookingPage />}
      {route === 'builder' && <BuilderPage />}
      {route === 'contacts' && <ContactsPage />}
      {route === 'account' && <AccountPage user={user} setUser={setUser} />}
      <Footer go={go} />
    </CartProvider>);

}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
